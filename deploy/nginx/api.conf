##############################################################################
# One Day Event — nginx config for the Laravel API
# Location: /etc/nginx/sites-available/api.onedayevent.com
# Symlink:  ln -s /etc/nginx/sites-available/api.onedayevent.com \
#                  /etc/nginx/sites-enabled/
##############################################################################

server {
    listen 80;
    server_name api.onedayevent.com;
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.onedayevent.com;

    # ── TLS ───────────────────────────────────────────────────────────────────
    # Certificates managed by Certbot / Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/api.onedayevent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.onedayevent.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Root / PHP ────────────────────────────────────────────────────────────
    root  /var/www/ode-api/public;
    index index.php;

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/api.onedayevent.com.access.log;
    error_log  /var/log/nginx/api.onedayevent.com.error.log warn;

    # ── Security headers (redundant with Laravel middleware; defence-in-depth) ─
    add_header X-Content-Type-Options  "nosniff"                            always;
    add_header X-Frame-Options         "DENY"                               always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"    always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(), payment=()" always;
    # HSTS — once added browsers enforce HTTPS for max-age seconds
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Remove PHP version fingerprint
    fastcgi_hide_header X-Powered-By;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_types      application/json text/plain application/javascript;
    gzip_min_length 256;

    # ── Laravel front-controller ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ──────────────────────────────────────────────────────────────
    location ~ \.php$ {
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php/php8.3-fpm.sock;  # adjust PHP version if needed
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # Pass real IP through (if behind a load balancer / CloudFront)
        fastcgi_param  HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param  HTTP_X_FORWARDED_PROTO $scheme;
        # Timeouts
        fastcgi_read_timeout 60;
    }

    # ── Block dotfiles (.env, .git, etc.) ─────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Block direct PHP execution outside public/ ────────────────────────────
    location ~* ^/(app|bootstrap|config|database|resources|routes|storage|tests)/ {
        deny all;
    }

    # ── Static assets (favicons, robots.txt) ─────────────────────────────────
    location ~* \.(ico|txt|xml)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Rate limiting at nginx level (backs up Laravel throttle middleware) ───
    # Requires http block in nginx.conf:
    #   limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req zone=api burst=20 nodelay;
    limit_req_status 429;
}
