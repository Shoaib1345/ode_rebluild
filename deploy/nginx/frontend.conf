##############################################################################
# One Day Event — nginx config for the React frontend (SPA)
# Location: /etc/nginx/sites-available/onedayevent.com
# Symlink:  ln -s /etc/nginx/sites-available/onedayevent.com \
#                  /etc/nginx/sites-enabled/
##############################################################################

server {
    listen 80;
    server_name onedayevent.com www.onedayevent.com;
    return 301 https://www.onedayevent.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name onedayevent.com;
    # Canonical redirect: non-www → www
    return 301 https://www.onedayevent.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.onedayevent.com;

    # ── TLS ───────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/www.onedayevent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.onedayevent.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Root ──────────────────────────────────────────────────────────────────
    root  /var/www/ode-frontend/dist;
    index index.html;

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/www.onedayevent.com.access.log;
    error_log  /var/log/nginx/www.onedayevent.com.error.log warn;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                            always;
    add_header X-Frame-Options         "SAMEORIGIN"                         always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"    always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # CSP — tighten per your actual CDN/font/analytics sources
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.onedayevent.com https://js.stripe.com; frame-src https://js.stripe.com;" always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # ── SPA routing — all routes fall back to index.html ─────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Hashed static assets — cache forever ─────────────────────────────────
    # Vite emits files like /assets/index-BzXk9cRp.js with content-hash names
    location /assets/ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        # Don't override security headers already set above
        add_header  X-Content-Type-Options "nosniff" always;
    }

    # ── index.html — never cache (always fresh) ───────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Favicon / robots / sitemap ────────────────────────────────────────────
    location ~* \.(ico|txt|xml)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Block dotfiles ────────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
