##############################################################################
# One Day Event — Supervisor config for the Laravel queue worker
#
# Location: /etc/supervisor/conf.d/ode-worker.conf
# After placing:
#   sudo supervisorctl reread
#   sudo supervisorctl update
#   sudo supervisorctl start ode-worker:*
##############################################################################

[program:ode-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/ode-api/artisan queue:work database \
        --sleep=3 \
        --tries=3 \
        --backoff=60 \
        --max-time=3600 \
        --queue=default

# Run 2 worker processes in parallel
numprocs=2

autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

# Run as the web server user (not root)
user=www-data

# Restart the worker after processing this many jobs to prevent memory leaks
# (equivalent to --max-jobs=500; combined with --max-time=3600 above)
; command already uses --max-time, which handles graceful restarts

# Logging
stdout_logfile=/var/log/supervisor/ode-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/ode-worker-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

##############################################################################
# Deployment note:
# After every deploy that changes queued jobs/mail classes, restart workers:
#   sudo supervisorctl restart ode-worker:*
# This ensures workers pick up the new code rather than holding stale classes.
##############################################################################
